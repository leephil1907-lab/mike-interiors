# Render Blueprint — deploys the public website and the private admin studio
# as two independent services that share one Supabase database.
#
# In Render: New → Blueprint → connect the repo containing this file.
# Then set the secret environment variables marked "sync: false" in the dashboard.

# Render reads this file when you create a Blueprint from the repo root.
services:
  # ---------------------------------------------------------------- website ---
  - type: web
    name: mike-interiors
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # Optional — enquiry emails start working as soon as these are set.
      - key: RESEND_API_KEY
        sync: false
      - key: ENQUIRY_TO_EMAIL
        sync: false
      - key: ENQUIRY_FROM
        sync: false

  # ------------------------------------------------------------ admin studio ---
  - type: web
    name: mike-interiors-admin
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
