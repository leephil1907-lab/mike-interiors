# ============================================================================
#  Render Blueprint — creates BOTH services from this one repo.
#
#  HOW TO USE:
#    Render dashboard → New + → Blueprint → pick this repo → Apply
#    Render reads this file, builds the website AND the admin studio,
#    then asks you for the secret values marked  sync: false  below.
#
#  ONE REPO. TWO SERVICES. Each service just points at a different folder.
# ============================================================================

services:
  # ─────────────────────────────────────────── 1. PUBLIC WEBSITE ─────────────
  # Builds from the repo root. This is what visitors see.
  - type: web
    name: mike-interiors
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── paste these in the Render dashboard when prompted ──
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # ── optional: switch on enquiry emails later, no code change ──
      - key: RESEND_API_KEY
        sync: false
      - key: ENQUIRY_TO_EMAIL
        sync: false
      - key: ENQUIRY_FROM
        sync: false

  # ─────────────────────────────────────────── 2. ADMIN STUDIO ───────────────
  # Builds from the /admin folder ONLY. Private, login required.
  # Same repo as above — the only difference is rootDir.
  - type: web
    name: mike-interiors-admin
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── paste these in the Render dashboard when prompted ──
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Set this to the website's URL after service #1 is live
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # MUST be the same string as the website's REVALIDATE_SECRET
      - key: REVALIDATE_SECRET
        sync: false
